name: Extract Sports Streams

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main

jobs:
  extract-streams:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run extraction script
      run: |
        python extract_streams.py
        
    - name: Check if data changed
      id: check_changes
      run: |
        git diff --exit-code streams_data.json || echo "changed=true" >> $GITHUB_OUTPUT
        
    - name: Commit and push if changed
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add streams_data.json
        git commit -m "Update streams data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        git push
        
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: streams-data
        path: streams_data.json
        retention-days: 30
